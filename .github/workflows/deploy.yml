name: Deploy Git Blog + NeuralScope

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Repository Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js Setup
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Portfolio/study/ai/package-lock.json

      # --------------------------------------------------
      # 3. NeuralScope Build
      # --------------------------------------------------
      - name: Install NeuralScope dependencies
        working-directory: Portfolio/study/ai
        run: npm ci

      - name: Build NeuralScope
        working-directory: Portfolio/study/ai
        env:
          NEXT_PUBLIC_BASE_PATH: /Portfolio/study/ai
        run: npm run build

      # --------------------------------------------------
      # 4. GitHub Pages Setup
      # --------------------------------------------------
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # 5. Existing Jekyll Blog Build
      # --------------------------------------------------
      - name: Build Jekyll Blog
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # --------------------------------------------------
      # 6. Replace AI path with NeuralScope static build
      # --------------------------------------------------
      - name: Deploy NeuralScope into Jekyll site
        shell: bash
        run: |
          rm -rf ./_site/Portfolio/study/ai
          mkdir -p ./_site/Portfolio/study/ai
          cp -a ./Portfolio/study/ai/out/. ./_site/Portfolio/study/ai/

      # --------------------------------------------------
      # 7. Upload complete site
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4