name: Deploy Git Blog + Portfolio Projects

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==================================================
      # 3. Build Portfolio Projects
      #
      # Portfolio/** 하위에서 package.json을 재귀 탐색합니다.
      # build script가 있는 프로젝트만 빌드합니다.
      #
      # Next.js Static Export 프로젝트는
      # npm run build 이후 out/을 생성해야 합니다.
      # ==================================================
      - name: Build Portfolio Projects
        shell: bash
        run: |
          set -euo pipefail

          PORTFOLIO_ROOT="Portfolio"

          echo "=========================================="
          echo "Portfolio Project Build"
          echo "=========================================="

          if [ ! -d "$PORTFOLIO_ROOT" ]; then
            echo "[INFO] Portfolio directory not found."
            exit 0
          fi

          while IFS= read -r package_file; do

            project="$(dirname "$package_file")"

            # ------------------------------------------
            # Generated/Internal directories 제외
            # ------------------------------------------
            if [[ "$project" == *"/node_modules/"* ]] || \
               [[ "$project" == *"/node_modules" ]] || \
               [[ "$project" == *"/.next/"* ]] || \
               [[ "$project" == *"/.next" ]] || \
               [[ "$project" == *"/out/"* ]] || \
               [[ "$project" == *"/out" ]]; then
              continue
            fi

            PROJECT_NAME="$(basename "$project")"
            BASE_PATH="/${project}"

            echo ""
            echo "------------------------------------------"
            echo "[PROJECT]"
            echo "Name     : $PROJECT_NAME"
            echo "Path     : $project"
            echo "BasePath : $BASE_PATH"
            echo "------------------------------------------"

            pushd "$project" > /dev/null

            # ------------------------------------------
            # build script 존재 확인
            # ------------------------------------------
            if ! node -e '
              const p = require("./package.json");
              process.exit(
                p.scripts && p.scripts.build ? 0 : 1
              );
            '; then
              echo "[SKIP] build script not found."
              popd > /dev/null
              continue
            fi

            # ------------------------------------------
            # Dependencies
            # ------------------------------------------
            if [ -f "package-lock.json" ]; then
              echo "[INSTALL] npm ci"
              npm ci
            else
              echo "[INSTALL] npm install"
              npm install
            fi

            # ------------------------------------------
            # Build
            # ------------------------------------------
            echo "[BUILD] npm run build"

            NEXT_PUBLIC_BASE_PATH="$BASE_PATH" \
              npm run build

            # ------------------------------------------
            # Static Export 결과 확인
            # ------------------------------------------
            if [ ! -d "out" ]; then
              echo ""
              echo "[WARN] out/ directory was not created."
              echo "Project: $project"
              echo ""
              echo "This project will not be merged into"
              echo "GitHub Pages automatically."
              echo ""

              popd > /dev/null
              continue
            fi

            popd > /dev/null

            echo "[SUCCESS] $project"

          done < <(
            find "$PORTFOLIO_ROOT" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -not -path "*/.next/*" \
              -not -path "*/out/*" \
              | sort
          )

      # ==================================================
      # 4. Configure GitHub Pages
      # ==================================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ==================================================
      # 5. Build Existing Jekyll Blog
      #
      # _config.yml 에서 Portfolio/ 전체를 제외합니다.
      # ==================================================
      - name: Build Jekyll Blog
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # ==================================================
      # 6. Prepare Writable Final Site
      #
      # jekyll-build-pages가 생성한 _site에 직접 쓰면
      # Permission denied가 발생할 수 있으므로
      # 별도의 최종 디렉터리에 복사합니다.
      # ==================================================
      - name: Prepare Final Site
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Prepare Final Site"
          echo "=========================================="

          rm -rf ./_final_site
          mkdir -p ./_final_site

          echo "[COPY]"
          echo "./_site/"
          echo "   ↓"
          echo "./_final_site/"

          cp -a ./_site/. ./_final_site/

          echo "[SUCCESS] Final site prepared."

      # ==================================================
      # 7. Merge Portfolio Projects
      #
      # Repository 경로를 그대로 URL 경로로 유지합니다.
      #
      # Portfolio/study/ai/out
      #   ↓
      # _final_site/Portfolio/study/ai
      #
      # Portfolio/resume/out
      #   ↓
      # _final_site/Portfolio/resume
      # ==================================================
      - name: Merge Portfolio Projects
        shell: bash
        run: |
          set -euo pipefail

          PORTFOLIO_ROOT="Portfolio"

          echo "=========================================="
          echo "Portfolio Project Merge"
          echo "=========================================="

          if [ ! -d "$PORTFOLIO_ROOT" ]; then
            echo "[INFO] Portfolio directory not found."
            exit 0
          fi

          while IFS= read -r package_file; do

            project="$(dirname "$package_file")"

            # ------------------------------------------
            # Generated/Internal directories 제외
            # ------------------------------------------
            if [[ "$project" == *"/node_modules/"* ]] || \
               [[ "$project" == *"/node_modules" ]] || \
               [[ "$project" == *"/.next/"* ]] || \
               [[ "$project" == *"/.next" ]] || \
               [[ "$project" == *"/out/"* ]] || \
               [[ "$project" == *"/out" ]]; then
              continue
            fi

            OUTPUT_DIR="$project/out"
            TARGET_DIR="_final_site/$project"

            # ------------------------------------------
            # out/ 없는 프로젝트는 SKIP
            # ------------------------------------------
            if [ ! -d "$OUTPUT_DIR" ]; then
              echo "[SKIP] no out/: $project"
              continue
            fi

            echo ""
            echo "------------------------------------------"
            echo "[MERGE]"
            echo "Source : $OUTPUT_DIR"
            echo "Target : $TARGET_DIR"
            echo "------------------------------------------"

            rm -rf "$TARGET_DIR"
            mkdir -p "$TARGET_DIR"

            cp -a "$OUTPUT_DIR"/. "$TARGET_DIR"/

            echo "[SUCCESS] $project"

          done < <(
            find "$PORTFOLIO_ROOT" \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -not -path "*/.next/*" \
              -not -path "*/out/*" \
              | sort
          )

      # ==================================================
      # 8. Validate Final Site
      # ==================================================
      - name: Validate Final Site
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final Site Validation"
          echo "=========================================="

          if [ ! -d "./_final_site" ]; then
            echo "[ERROR] _final_site does not exist."
            exit 1
          fi

          echo ""
          echo "[INFO] Root files:"
          ls -la ./_final_site | head -50

          echo ""
          echo "[INFO] Portfolio index files:"

          if [ -d "./_final_site/Portfolio" ]; then
            find ./_final_site/Portfolio \
              -type f \
              -name "index.html" \
              | sort
          else
            echo "[INFO] No Portfolio directory."
          fi

          echo ""
          echo "[SUCCESS] Validation completed."

      # ==================================================
      # 9. Upload GitHub Pages Artifact
      # ==================================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_final_site

  # ======================================================
  # 10. Deploy GitHub Pages
  # ======================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4