name: Deploy Git Blog + Portfolio Projects

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==================================================
      # 3. Build Portfolio Projects
      #
      # GitHub Pages 배포를 위해 실제 빌드가 필요한
      # 프로젝트만 명시적으로 관리합니다.
      #
      # 중요:
      # - Portfolio 전체 package.json 자동 탐색 금지
      # - 천류관 등 Static 프로젝트는 빌드하지 않음
      #
      # 신규 Build 프로젝트 추가 시
      # BUILD_PROJECTS 배열에 경로만 추가합니다.
      # ==================================================
      - name: Build Portfolio Projects
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PROJECTS=(
            "Portfolio/study/ai"
            "Portfolio/study/cs"
          )

          echo "=========================================="
          echo "Portfolio Build Projects"
          echo "=========================================="

          for project in "${BUILD_PROJECTS[@]}"; do
            echo ""
            echo "------------------------------------------"
            echo "[PROJECT]"
            echo "Path : $project"
            echo "------------------------------------------"

            # ------------------------------------------
            # 프로젝트 디렉터리 존재 확인
            # ------------------------------------------
            if [ ! -d "$project" ]; then
              echo "[ERROR] Project directory not found: $project"
              exit 1
            fi

            # ------------------------------------------
            # package.json 존재 확인
            # ------------------------------------------
            if [ ! -f "$project/package.json" ]; then
              echo "[ERROR] package.json not found: $project"
              exit 1
            fi

            pushd "$project" > /dev/null

            # ------------------------------------------
            # build script 존재 확인
            # ------------------------------------------
            if ! node -e '
              const p = require("./package.json");

              if (!p.scripts || !p.scripts.build) {
                process.exit(1);
              }
            '; then
              echo "[ERROR] build script not found: $project/package.json"
              popd > /dev/null
              exit 1
            fi

            # ------------------------------------------
            # Dependencies
            # ------------------------------------------
            if [ -f "package-lock.json" ]; then
              echo "[INSTALL] npm ci"
              npm ci
            else
              echo "[INSTALL] npm install"
              npm install
            fi

            # ------------------------------------------
            # GitHub Pages Base Path
            #
            # 예:
            # Portfolio/study/ai
            # → /Portfolio/study/ai
            # ------------------------------------------
            BASE_PATH="/${project}"

            echo "[INFO] BasePath: $BASE_PATH"

            # ------------------------------------------
            # Build
            # ------------------------------------------
            echo "[BUILD] npm run build"

            NEXT_PUBLIC_BASE_PATH="$BASE_PATH" \
              npm run build

            # ------------------------------------------
            # Static Export 결과 확인
            # ------------------------------------------
            if [ ! -d "out" ]; then
              echo ""
              echo "[ERROR] out/ directory was not created."
              echo "Project: $project"
              echo ""
              echo "GitHub Pages requires a static export."
              echo ""
              popd > /dev/null
              exit 1
            fi

            popd > /dev/null

            echo "[SUCCESS] Build completed: $project"
          done

      # ==================================================
      # 4. Configure GitHub Pages
      # ==================================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ==================================================
      # 5. Build Existing Jekyll Blog
      #
      # 기존 _config.yml 정책에 따라 Jekyll 본체를
      # _site 디렉터리에 빌드합니다.
      #
      # Portfolio는 이후 별도로 원본을 복사합니다.
      # ==================================================
      - name: Build Jekyll Blog
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # ==================================================
      # 6. Prepare Final Site
      #
      # 최종 GitHub Pages artifact를 만들기 위한
      # writable 디렉터리를 생성합니다.
      # ==================================================
      - name: Prepare Final Site
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Prepare Final Site"
          echo "=========================================="

          rm -rf ./_final_site
          mkdir -p ./_final_site

          echo "[COPY]"
          echo "./_site/"
          echo "   ↓"
          echo "./_final_site/"

          cp -a ./_site/. ./_final_site/

          echo "[SUCCESS] Jekyll site copied."

      # ==================================================
      # 7. Copy Static Portfolio
      #
      # Portfolio는 기본적으로 STATIC 프로젝트로
      # 취급합니다.
      #
      # 천류관을 포함한 기존 HTML/JS/CSS 프로젝트는
      # 원본 디렉터리 구조를 그대로 유지합니다.
      #
      # 빌드 산출물 및 dependency는 제외합니다.
      # ==================================================
      - name: Copy Static Portfolio
        shell: bash
        run: |
          set -euo pipefail

          PORTFOLIO_ROOT="Portfolio"
          TARGET_ROOT="_final_site/Portfolio"

          echo "=========================================="
          echo "Copy Static Portfolio"
          echo "=========================================="

          if [ ! -d "$PORTFOLIO_ROOT" ]; then
            echo "[INFO] Portfolio directory not found."
            exit 0
          fi

          mkdir -p "$TARGET_ROOT"

          echo "[COPY]"
          echo "./Portfolio/"
          echo "   ↓"
          echo "./_final_site/Portfolio/"

          rsync -a \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='out/' \
            --exclude='.git/' \
            "$PORTFOLIO_ROOT/" \
            "$TARGET_ROOT/"

          echo "[SUCCESS] Static Portfolio copied."

      # ==================================================
      # 8. Merge Built Portfolio Projects
      #
      # BUILD_PROJECTS에 등록된 프로젝트만
      # source 대신 out/ 결과로 교체합니다.
      #
      # 예:
      #
      # Portfolio/study/ai/out/
      #       ↓
      # _final_site/Portfolio/study/ai/
      #
      # Portfolio/study/cs/out/
      #       ↓
      # _final_site/Portfolio/study/cs/
      # ==================================================
      - name: Merge Built Portfolio Projects
        shell: bash
        run: |
          set -euo pipefail

          BUILD_PROJECTS=(
            "Portfolio/study/ai"
            "Portfolio/study/cs"
          )

          echo "=========================================="
          echo "Merge Built Portfolio Projects"
          echo "=========================================="

          for project in "${BUILD_PROJECTS[@]}"; do
            OUTPUT_DIR="$project/out"
            TARGET_DIR="_final_site/$project"

            echo ""
            echo "------------------------------------------"
            echo "[MERGE]"
            echo "Source : $OUTPUT_DIR"
            echo "Target : $TARGET_DIR"
            echo "------------------------------------------"

            if [ ! -d "$OUTPUT_DIR" ]; then
              echo "[ERROR] Build output missing: $OUTPUT_DIR"
              exit 1
            fi

            # ------------------------------------------
            # Static source를 Build 결과로 교체
            # ------------------------------------------
            rm -rf "$TARGET_DIR"
            mkdir -p "$TARGET_DIR"

            cp -a "$OUTPUT_DIR"/. "$TARGET_DIR"/

            echo "[SUCCESS] Merged: $project"
          done

      # ==================================================
      # 9. Validate Final Site
      #
      # 핵심 서비스가 최종 artifact에서 누락되면
      # 배포하지 않고 Build 자체를 실패시킵니다.
      # ==================================================
      - name: Validate Final Site
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final Site Validation"
          echo "=========================================="

          if [ ! -d "./_final_site" ]; then
            echo "[ERROR] _final_site does not exist."
            exit 1
          fi

          # ------------------------------------------
          # 반드시 존재해야 하는 파일
          # ------------------------------------------
          REQUIRED_FILES=(
            "_final_site/index.html"
            "_final_site/Portfolio/Game/Cheonryugwan-Archive/index.html"
            "_final_site/Portfolio/study/ai/index.html"
            "_final_site/Portfolio/study/cs/index.html"
          )

          echo ""
          echo "[CHECK] Required files"
          echo ""

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Required file missing:"
              echo "$file"
              exit 1
            fi

            echo "[OK] $file"
          done

          # ------------------------------------------
          # 천류관 주요 디렉터리 확인
          # ------------------------------------------
          CHEONRYUGWAN_ROOT="_final_site/Portfolio/Game/Cheonryugwan-Archive"

          REQUIRED_CHEONRYUGWAN_DIRS=(
            "$CHEONRYUGWAN_ROOT/assets"
            "$CHEONRYUGWAN_ROOT/data"
            "$CHEONRYUGWAN_ROOT/game"
            "$CHEONRYUGWAN_ROOT/pages"
          )

          echo ""
          echo "[CHECK] Cheonryugwan directories"
          echo ""

          for dir in "${REQUIRED_CHEONRYUGWAN_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "[ERROR] Required directory missing:"
              echo "$dir"
              exit 1
            fi

            echo "[OK] $dir"
          done

          # ------------------------------------------
          # Portfolio 배포 결과 출력
          # ------------------------------------------
          echo ""
          echo "[INFO] Portfolio index files:"
          echo ""

          find ./_final_site/Portfolio \
            -type f \
            -name "index.html" \
            | sort

          echo ""
          echo "=========================================="
          echo "[SUCCESS] Final Site Validation Completed"
          echo "=========================================="

      # ==================================================
      # 10. Upload GitHub Pages Artifact
      # ==================================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_final_site

  # ======================================================
  # 11. Deploy GitHub Pages
  # ======================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4