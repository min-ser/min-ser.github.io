<ellipse class="sweep" cx="200" cy="70" rx="146" ry="48"/>
<g class="radar" opacity=".22"><path d="M200 70L337 36" stroke="#61e7ff"/><path d="M200 70A142 142 0 0 1 310 25" fill="none" stroke="#61e7ff"/></g>
<path class="link" d="M200 70L109 35M200 70L133 106M200 70L280 31M200 70L305 88M200 70L209 118"/>
