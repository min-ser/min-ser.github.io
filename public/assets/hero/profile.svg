<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-labelledby="title desc">
<title id="title">Engineer Core</title><desc id="desc">Cloud, Kubernetes, Fabric, AI and DevOps capabilities connect to a central engineer core through independent orbital paths.</desc>
<style>
text{font-family:Consolas,monospace}.grid{stroke:#12323d;stroke-width:.6}.orbit{fill:none;stroke:#1e6477;stroke-width:1}.orbit2{fill:none;stroke:#164957;stroke-width:.8;stroke-dasharray:3 5}.link{fill:none;stroke:#39d8ff;stroke-width:1;stroke-dasharray:2 5;opacity:.28}.coreRing{fill:#07161c;stroke:#5ce6ff;stroke-width:1.3}.coreInner{fill:#09232c;stroke:#2d9bb5}.node{fill:#07161c;stroke:#3acfea;stroke-width:1}.nodeHalo{fill:none;stroke:#3acfea;opacity:.2}.ico{fill:none;stroke:#7beaff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.label{fill:#83b9ca;font-size:6.2px;text-anchor:middle}.micro{fill:#4d7c8b;font-size:5.5px}.status{fill:#68e8ff;font-size:6px}.sweep{fill:none;stroke:#55e5ff;stroke-width:1.4;stroke-linecap:round;opacity:.75;stroke-dasharray:28 330;animation:sweep 9s linear infinite}.signal{fill:#a7f5ff;filter:drop-shadow(0 0 4px #55e5ff)}
.n1{animation:n1 9s ease-in-out infinite}.n2{animation:n2 9s ease-in-out infinite}.n3{animation:n3 9s ease-in-out infinite}.n4{animation:n4 9s ease-in-out infinite}.n5{animation:n5 9s ease-in-out infinite}.corePulse{animation:core 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.radar{animation:radar 12s linear infinite;transform-origin:200px 70px}.sig1{animation:sig1 9s linear infinite}.sig2{animation:sig2 9s linear infinite}.sig3{animation:sig3 9s linear infinite}.sig4{animation:sig4 9s linear infinite}.sig5{animation:sig5 9s linear infinite}
@keyframes sweep{to{stroke-dashoffset:-358}}@keyframes radar{to{transform:rotate(360deg)}}@keyframes core{50%{filter:drop-shadow(0 0 8px #22cdec);transform:scale(1.035)}}
@keyframes n1{0%,12%,100%{filter:none}5%,9%{filter:drop-shadow(0 0 6px #55e5ff)}}@keyframes n2{0%,27%,100%{filter:none}20%,24%{filter:drop-shadow(0 0 6px #55e5ff)}}@keyframes n3{0%,42%,100%{filter:none}35%,39%{filter:drop-shadow(0 0 6px #55e5ff)}}@keyframes n4{0%,57%,100%{filter:none}50%,54%{filter:drop-shadow(0 0 6px #55e5ff)}}@keyframes n5{0%,72%,100%{filter:none}65%,69%{filter:drop-shadow(0 0 6px #55e5ff)}}
@keyframes sig1{0%,2%{opacity:0;transform:translate(0)}6%{opacity:1}12%{opacity:0;transform:translate(-91px,-35px)}100%{opacity:0}}@keyframes sig2{0%,17%{opacity:0;transform:translate(0)}21%{opacity:1}27%{opacity:0;transform:translate(-67px,36px)}100%{opacity:0}}@keyframes sig3{0%,32%{opacity:0;transform:translate(0)}36%{opacity:1}42%{opacity:0;transform:translate(80px,-39px)}100%{opacity:0}}@keyframes sig4{0%,47%{opacity:0;transform:translate(0)}51%{opacity:1}57%{opacity:0;transform:translate(105px,18px)}100%{opacity:0}}@keyframes sig5{0%,62%{opacity:0;transform:translate(0)}66%{opacity:1}72%{opacity:0;transform:translate(9px,48px)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g opacity=".45"><path class="grid" d="M20 25H380M20 50H380M20 75H380M20 100H380M20 125H380M50 12V130M100 12V130M150 12V130M200 12V130M250 12V130M300 12V130M350 12V130"/></g>
<text class="status" x="18" y="17">ENGINEER CORE // SYSTEM MAP</text><text class="micro" x="305" y="17">05 DOMAINS · LINK ACTIVE</text>
