<g class="n1"><circle class="nodeHalo" cx="109" cy="35" r="18"/><circle class="node" cx="109" cy="35" r="14"/><path class="ico" d="M101 38h16a5 5 0 0 0 0-10 7 7 0 0 0-13 2 4 4 0 0 0-3 8Z"/><text class="label" x="109" y="56">CLOUD</text></g>
<g class="n2"><circle class="nodeHalo" cx="133" cy="106" r="18"/><circle class="node" cx="133" cy="106" r="14"/><path class="ico" d="M133 96l8 5v10l-8 5-8-5v-10 8l8 4 8-4m-8-13v8m-7-3 7 4 7-4"/><text class="label" x="133" y="128">AKS</text></g>
<g class="n3"><circle class="nodeHalo" cx="280" cy="31" r="18"/><circle class="node" cx="280" cy="31" r="14"/><path class="ico" d="M272 24h16v4h-16zm0 5h16v4h-16zm0 5h16v4h-16z"/><text class="label" x="280" y="52">FABRIC</text></g>
<g class="n4"><circle class="nodeHalo" cx="305" cy="88" r="18"/><circle class="node" cx="305" cy="88" r="14"/><path class="ico" d="M299 82h12v12h-12zM305 77v5m0 12v5m-11-11h5m12 0h5"/><circle class="ico" cx="305" cy="88" r="3"/><text class="label" x="305" y="110">AI</text></g>
<g class="n5"><circle class="nodeHalo" cx="209" cy="118" r="16"/><circle class="node" cx="209" cy="118" r="12"/><path class="ico" d="M202 114c2-4 6-4 9-1l5 5-5 5c-3 3-7 3-9-1l4-4-4-4Zm14 0c-2-4-6-4-9-1l-5 5 5 5c3 3 7 3 9-1l-4-4 4-4Z"/><text class="label" x="209" y="136">DEVOPS</text></g>
<circle class="signal sig1" cx="200" cy="70" r="2.6"/><circle class="signal sig2" cx="200" cy="70" r="2.6"/><circle class="signal sig3" cx="200" cy="70" r="2.6"/><circle class="signal sig4" cx="200" cy="70" r="2.6"/><circle class="signal sig5" cx="200" cy="70" r="2.6"/>
<g transform="translate(335 112)"><rect x="0" y="0" width="46" height="14" fill="#06151b" stroke="#1f6577"/><circle cx="8" cy="7" r="2" fill="#55e5ff"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle><text class="micro" x="14" y="9">CONNECTED</text></g>
