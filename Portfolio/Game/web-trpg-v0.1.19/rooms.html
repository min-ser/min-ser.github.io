<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web TRPG · 방 찾기</title><style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;background:#090f18;color:#f2e4cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#2a3040,#090f18 60%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:34px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:26px}h1{color:#e7bf7e;font-size:clamp(24px,4vw,36px);margin:5px 0}h2{font-size:20px;color:#e7bf7e;margin-top:0}.sub{color:#b4b7bf;font-size:14px}a{color:#e7bf7e}.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.panel{background:#111e2ae8;border:1px solid #5c503e;border-radius:8px;padding:22px;box-shadow:0 14px 40px #0005}.list{display:grid;gap:11px}.room{padding:17px;background:#182633;border:1px solid #59606a;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:12px}.room h3{margin:0 0 6px;font-size:17px}.meta{font-size:13px;color:#bdc3c9}.pill{border:1px solid #94754b;border-radius:20px;padding:3px 9px;font-size:11px;color:#e7bf7e}input,select{display:block;width:100%;padding:12px;background:#0d1822;color:#f2e4cc;border:1px solid #66707b;border-radius:4px;font:inherit;margin-top:7px}label{display:block;margin:12px 0;color:#e0d2ba;font-size:13px}button{cursor:pointer;background:#b99157;color:#10151a;border:0;border-radius:4px;padding:11px 17px;font:inherit;font-weight:700}button.secondary{background:#1b2937;color:#e7c58c;border:1px solid #94754b}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap}.err{color:#ffafaa;min-height:20px;font-size:13px}.hidden{display:none!important}.members{display:grid;gap:9px;margin:15px 0}.member{padding:12px;background:#1b2b36;border-left:3px solid #ba945f}.small{font-size:12px;color:#adb9c1}.room button{flex:none}@media(max-width:750px){.layout{grid-template-columns:1fr}.room{align-items:flex-start;flex-direction:column}}
.lobby-chat-panel{margin:20px 0;padding:16px;border:1px solid #62533c;border-radius:6px;background:#0d1823}.lobby-chat-panel h3{margin:0 0 12px;color:#e7bf7e}.lobby-messages{height:220px;overflow-y:auto;background:#07111b;border:1px solid #394956;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:8px}.lobby-msg{padding:8px 10px;background:#1b2b39;border-left:2px solid #b99157;border-radius:3px;overflow-wrap:anywhere}.lobby-msg.notice{color:#c5b18e;background:#222720;border-left-color:#6c8b72}.lobby-msg b{color:#e7bf7e}.lobby-msg small{color:#9eabb5;margin-left:8px}#lobby-chat-form{display:flex;gap:8px;margin-top:10px}#lobby-chat-form input{margin:0;flex:1;min-width:0}#ready-btn.ready{background:#527b65;color:#fff}@media(max-width:550px){#lobby-chat-form{flex-wrap:wrap}#lobby-chat-form button{width:100%}}
</style></head><body><div class="wrap"><header><div><div class="sub">ONLINE LOBBY · Web TRPG</div><h1>모험의 방</h1><div class="sub">친구들과 방을 만들고 같은 모험에 참가하세요.</div></div><a href="index.html">기존 게임 홈으로</a></header><div class="layout"><section class="panel" id="browse"><div class="actions" style="justify-content:space-between;align-items:center"><h2>참가 가능한 방</h2><button class="secondary" onclick="loadRooms()">새로고침</button></div><div class="list" id="room-list">방 목록을 불러오는 중...</div></section><section class="panel" id="create-panel"><h2>새 방 만들기</h2><form id="create-form"><label>내 표시 이름<input name="name" required maxlength="40" pattern="[A-Za-z0-9_가-힣-]+" placeholder="예: 연무설"></label><label>방 제목<input name="title" required minlength="2" maxlength="60" placeholder="예: 산속의 초대"></label><label>최대 인원<select name="maxPlayers"><option value="2">2명</option><option value="4" selected>4명</option><option value="6">6명</option><option value="8">8명</option><option value="12">12명</option></select></label><label>방 비밀번호 (선택)<input name="password" type="password" maxlength="72" autocomplete="new-password" placeholder="없으면 누구나 입장"></label><label><input type="checkbox" name="private" style="display:inline;width:auto;margin:0"> 비공개방 (목록에 표시하지 않음)</label><button type="submit">방 생성하기</button></form><p class="err" id="create-error"></p></section><section class="panel hidden" id="join-panel"><h2>방 참가</h2><p id="join-title"></p><form id="join-form"><label>내 표시 이름<input name="name" required maxlength="40" pattern="[A-Za-z0-9_가-힣-]+"></label><label id="password-field">비밀번호<input name="password" type="password" autocomplete="current-password"></label><div class="actions"><button type="submit">입장하기</button><button type="button" class="secondary" onclick="showBrowse()">취소</button></div></form><p class="err" id="join-error"></p></section><section class="panel hidden" id="waiting-panel"><h2 id="waiting-title">대기실</h2><div class="sub" id="waiting-status"></div><div class="members" id="members"></div><div class="actions"><button id="ready-btn" onclick="toggleReady()">준비 완료</button><span class="small" id="ready-status">준비 상태를 선택하세요.</span></div><section class="lobby-chat-panel" aria-label="대기실 채팅"><h3>대기실 채팅</h3><div class="lobby-messages" id="lobby-messages" role="log" aria-live="polite"></div><form id="lobby-chat-form"><input id="lobby-chat-input" maxlength="400" required autocomplete="off" placeholder="참가자에게 메시지 보내기"><button type="submit">전송</button></form></section><div class="actions"><button class="secondary" onclick="copyInvite()">초대 주소 복사</button><button class="secondary" onclick="leaveRoom()">방 나가기</button></div><p class="small">대기실 채팅·준비 상태는 서버에서 공유됩니다. 시나리오·캐릭터·GM 선택과 동시 게임 시작은 후속 버전에서 연결됩니다.</p><p class="err" id="waiting-error"></p></section></div></div><script>
let chosen=null,joined=null,stream=null,listing=null,myReady=false;
const $=id=>document.getElementById(id);
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(({ 'wrong password':'비밀번호가 올바르지 않습니다.','room full':'방이 가득 찼습니다.','name already in use':'같은 이름의 참가자가 있습니다.','game already started':'이미 시작된 게임입니다.'})[d.error]||d.error||'요청에 실패했습니다.');return d}
function show(id){for(const x of ['browse','create-panel','join-panel','waiting-panel'])$(x).classList.toggle('hidden',id==='waiting-panel'?x!=='waiting-panel':id==='join-panel'?x==='browse'||x==='create-panel'||x==='waiting-panel':x==='join-panel'||x==='waiting-panel')}
function showBrowse(){chosen=null;show('browse')}
function renderRooms(data){$('room-list').innerHTML=data.length?data.map(r=>`<div class="room"><div><h3>${safe(r.title)}</h3><div class="meta">${r.players}/${r.maxPlayers}명 · ${r.status==='waiting'?'대기 중':'진행 중'} · <span class="pill">${r.locked?'🔒 비밀번호':'공개'}</span></div></div><button class="secondary" onclick="selectRoom('${r.id}')" ${r.players>=r.maxPlayers||r.status!=='waiting'?'disabled':''}>참가</button></div>`).join(''):'<p class="sub">아직 공개된 방이 없습니다. 새 방을 만들어 보세요.</p>';window.roomsCache=data}
async function loadRooms(){try{renderRooms((await api('/api/rooms')).rooms)}catch(e){$('room-list').textContent='서버 연결에 실패했습니다. node server.js 실행 여부를 확인하세요.'}}
function selectRoom(id){chosen=(window.roomsCache||[]).find(r=>r.id===id)||{id,title:'초대된 방',locked:true};$('join-title').textContent=chosen.title;$('password-field').classList.toggle('hidden',!chosen.locked);show('join-panel')}
async function enter(d){joined={id:d.room.id,token:d.token,name:d.me?.name||d.members.find(m=>m.name===d.members.at(-1).name)?.name};sessionStorage.setItem('webtrpg.lobby',JSON.stringify(joined));show('waiting-panel');$('waiting-title').textContent=d.room.title;updateMembers({members:d.members,status:d.room.status});if(stream)stream.close();stream=new EventSource(`/api/rooms/${joined.id}/events?token=${encodeURIComponent(joined.token)}`);stream.addEventListener('members',e=>updateMembers(JSON.parse(e.data)));stream.addEventListener('lobby-history',e=>{try{renderChat(JSON.parse(e.data))}catch{}});stream.addEventListener('lobby-chat',e=>{try{appendChat(JSON.parse(e.data))}catch{}});stream.onerror=()=>$('waiting-error').textContent='연결이 끊어졌습니다. 서버 상태를 확인하세요.';history.replaceState(null,'','?room='+joined.id)}
function updateMembers(d){const mine=d.members.find(m=>m.name===joined?.name);myReady=!!mine?.ready;$('ready-btn').textContent=myReady?'준비 취소':'준비 완료';$('ready-btn').classList.toggle('ready',myReady);$('ready-status').textContent=myReady?'준비 완료 상태입니다.':'아직 준비하지 않았습니다.';$('waiting-status').textContent='현재 참가자 '+d.members.length+'명 · '+(d.status==='waiting'?'대기 중':'진행 중');$('members').innerHTML=d.members.map(m=>`<div class="member">${safe(m.name)} ${m.host?'<span class="pill">방장</span>':''} <span class="pill">${m.ready?'✓ 준비 완료':'대기 중'}</span></div>`).join('')}
function appendChat(m){const box=$('lobby-messages'),line=document.createElement('div');line.className='lobby-msg'+(m.kind==='notice'?' notice':'');const label=document.createElement('b');label.textContent=m.name;const text=document.createElement('span');text.textContent=' '+m.text;line.append(label,text);box.append(line);while(box.children.length>100)box.firstChild.remove();box.scrollTop=box.scrollHeight}
function renderChat(items){$('lobby-messages').replaceChildren();items.forEach(appendChat)}
async function toggleReady(){if(!joined)return;$('waiting-error').textContent='';try{await api(`/api/rooms/${joined.id}/ready`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+joined.token},body:JSON.stringify({ready:!myReady})})}catch(e){$('waiting-error').textContent=e.message}}
$('lobby-chat-form').onsubmit=async e=>{e.preventDefault();if(!joined)return;const input=$('lobby-chat-input'),text=input.value.trim();if(!text)return;try{await api(`/api/rooms/${joined.id}/chat`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+joined.token},body:JSON.stringify({text})});input.value=''}catch(e){$('waiting-error').textContent=e.message}};
$('create-form').onsubmit=async e=>{e.preventDefault();$('create-error').textContent='';const f=new FormData(e.target);try{const d=await api('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),title:f.get('title'),maxPlayers:Number(f.get('maxPlayers')),password:f.get('password'),private:f.has('private')})});await enter(d)}catch(err){$('create-error').textContent=err.message}};
$('join-form').onsubmit=async e=>{e.preventDefault();$('join-error').textContent='';const f=new FormData(e.target);try{await enter(await api(`/api/rooms/${chosen.id}/join`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),password:f.get('password')||''})}))}catch(err){$('join-error').textContent=err.message}};
async function leaveRoom(){if(!joined)return;try{await api(`/api/rooms/${joined.id}/leave`,{method:'POST',headers:{Authorization:'Bearer '+joined.token}})}catch(e){}stream?.close();joined=null;sessionStorage.removeItem('webtrpg.lobby');history.replaceState(null,'','rooms.html');showBrowse();loadRooms()}
async function copyInvite(){const url=new URL(location.href);url.searchParams.set('room',joined.id);try{await navigator.clipboard.writeText(url.href);$('waiting-error').textContent='초대 주소를 복사했습니다.'}catch(e){$('waiting-error').textContent=url.href}}
async function resume(){const data=sessionStorage.getItem('webtrpg.lobby');if(!data)return;try{const m=JSON.parse(data),d=await api(`/api/rooms/${m.id}/state`,{headers:{Authorization:'Bearer '+m.token}});await enter({...d,token:m.token})}catch(e){sessionStorage.removeItem('webtrpg.lobby')}}
loadRooms();listing=new EventSource('/api/rooms/events');listing.addEventListener('rooms',e=>renderRooms(JSON.parse(e.data)));resume().then(()=>{if(!joined){const id=new URLSearchParams(location.search).get('room');if(id&&/^[a-f0-9]{8}$/.test(id))selectRoom(id)}});
</script></body></html>
