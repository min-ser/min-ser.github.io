<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scenario Editor · Cheonryugwan</title>
<link rel="stylesheet" href="../../assets/css/editor-console.css"><link rel="stylesheet" href="../../assets/css/tokens.css"><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/layout.css"><link rel="stylesheet" href="../../assets/css/components.css">
<style>
.ide{display:grid;grid-template-columns:260px minmax(430px,1fr) 390px;grid-template-rows:minmax(560px,calc(100vh - 174px)) 190px;gap:8px;padding:8px}
.pane{background:#070d12;border:1px solid var(--line);border-radius:6px;min-height:0;overflow:hidden}.ph{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);font-size:11px;color:#a6b7b7}.pb{height:calc(100% - 39px);overflow:auto;padding:8px}
.explorer{grid-row:1}.timeline{grid-row:1}.inspector{grid-row:1}.bottom{grid-column:1/-1;grid-row:2}
.scene{padding:8px;border:1px solid #18303a;background:#091117;border-radius:5px;margin-bottom:5px;cursor:pointer}.scene.active{border-color:var(--green);box-shadow:inset 3px 0 var(--green)}.scene.dragging{opacity:.45}.sid{font-size:10px;color:var(--cyan)}.st{font-size:11px;color:#aab9ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.group{margin-bottom:13px}.group-title{font-size:10px;color:var(--green);letter-spacing:.1em;margin-bottom:7px}.field{margin-bottom:7px}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}.field input,.field textarea,.field select{width:100%;background:#020609;border:1px solid #203640;color:var(--text);padding:6px;border-radius:4px}.field textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stage{height:48%;min-height:250px;background:#05090c center/cover no-repeat;position:relative}.dialog{position:absolute;left:4%;right:4%;bottom:4%;padding:12px;background:#020609e8;border:1px solid #28414b;border-left:3px solid var(--green)}.speaker{color:var(--green);font-weight:bold;margin-bottom:6px}.asset-tabs{display:flex;gap:4px;margin-bottom:7px}.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.asset{border:1px solid #18313a;padding:4px;font-size:9px;cursor:pointer;overflow:hidden}.asset:hover{border-color:var(--cyan)}.asset img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#020405}.bottom-tabs{display:flex;gap:4px}.console{height:125px;overflow:auto;background:#020405;padding:8px;font-size:10px;white-space:pre-wrap}.issue{padding:6px;border-bottom:1px solid #14272e;cursor:pointer}.issue.error{color:#ff9aaa}.issue.warn{color:#ffd166}.search{width:100%;margin-bottom:7px}.tiny{font-size:9px;color:var(--muted)}
@media(max-width:1100px){.ide{grid-template-columns:220px 1fr;grid-template-rows:auto}.inspector{grid-column:1/-1}.bottom{grid-column:1/-1}.pane{min-height:420px}}
@media(max-width:720px){.ide{display:block}.pane{margin-bottom:8px;min-height:420px}}
</style></head><body>
<main>
<div class="page-heading" style="padding:12px 14px 0"><div><div style="color:var(--green);font-size:10px">$ scenario.workspace</div><h1>Scenario Editor</h1><p>JSON을 몰라도 장면을 추가하고 에셋·연출·오디오를 설정하여 검증/내보내기 할 수 있습니다.</p></div>
<div class="ui-toolbar"><button class="ui-btn" id="new">NEW</button><label class="ui-btn" for="import">IMPORT</label><input hidden id="import" type="file" accept=".json"><button class="ui-btn" id="undo">UNDO</button><button class="ui-btn" id="redo">REDO</button><button class="ui-btn" id="validate">VALIDATE</button><button class="ui-btn ui-btn--primary" id="export">EXPORT</button></div></div>
<div class="ide">
<section class="pane explorer"><div class="ph"><span>SCENE EXPLORER</span><button class="ui-btn" id="add">+</button></div><div class="pb"><input class="ui-input search" id="search" placeholder="ID / 화자 / 대사 검색"><div class="ui-toolbar" style="margin-bottom:7px"><button class="ui-btn" id="dup">복제</button><button class="ui-btn" id="del">삭제</button></div><div id="list"></div></div></section>
<section class="pane timeline"><div class="ph"><span>LIVE GAME PREVIEW</span><span id="counter">0 / 0</span></div><div class="pb" style="padding:0"><div id="stage" class="stage"><div class="dialog"><div id="pspeaker" class="speaker">NARRATION</div><div id="ptext"></div></div></div>
<div style="padding:8px"><div class="ui-toolbar"><button class="ui-btn" id="prev">◀ PREV</button><button class="ui-btn" id="next">NEXT ▶</button><button class="ui-btn" id="play">AUTO</button><button class="ui-btn" id="runtime">OPEN GAME RUNTIME</button></div>
<div class="asset-tabs" style="margin-top:10px"><button class="ui-btn assetTab" data-type="backgrounds">BACKGROUND</button><button class="ui-btn assetTab" data-type="characters">CHARACTER</button><button class="ui-btn assetTab" data-type="cg">CG</button><button class="ui-btn assetTab" data-type="audio">AUDIO</button></div>
<input class="ui-input search" id="assetSearch" placeholder="Asset 검색"><div id="assetGrid" class="asset-grid"><div class="ui-empty">Asset 탭을 선택하세요.</div></div></div></div></section>
<section class="pane inspector"><div class="ph"><span>SCENE INSPECTOR</span><span id="dirty">SAVED</span></div><div class="pb">
<div class="group"><div class="group-title">CORE</div><div class="field"><label>ID</label><input id="id"></div><div class="field"><label>TYPE</label><select id="type"><option>dialogue</option><option>narration</option><option>cg</option><option>transition</option><option>choice</option><option>battle</option></select></div><div class="field"><label>SPEAKER</label><input id="speaker"></div><div class="field"><label>TEXT</label><textarea id="text"></textarea></div></div>
<div class="group"><div class="group-title">VISUAL</div><div class="field"><label>BACKGROUND</label><input id="background"></div><div class="row"><div class="field"><label>CHARACTER</label><input id="character"></div><div class="field"><label>EXPRESSION</label><input id="expression"></div></div><div class="row"><div class="field"><label>POSITION</label><select id="position"><option></option><option>left</option><option>center</option><option>right</option></select></div><div class="field"><label>CAMERA</label><input id="camera"></div></div><div class="field"><label>CG</label><input id="cg"></div></div>
<div class="group"><div class="group-title">AUDIO / EFFECT</div><div class="row"><div class="field"><label>BGM</label><input id="bgm"></div><div class="field"><label>SFX</label><input id="sfx"></div></div><div class="row"><div class="field"><label>AMBIENT</label><input id="ambient"></div><div class="field"><label>EFFECT</label><input id="effect"></div></div></div>
<div class="group"><div class="group-title">CONTROL</div><div class="row"><div class="field"><label>VISIBLE</label><select id="visible"><option value="">default</option><option value="true">true</option><option value="false">false</option></select></div><div class="field"><label>END</label><select id="end"><option value="">false</option><option value="true">true</option></select></div></div><div class="field"><label>CHOICES (JSON)</label><textarea id="choices" placeholder='[{"text":"선택","target":"scene-id"}]'></textarea></div></div>
</div></section>
<section class="pane bottom"><div class="ph"><div class="bottom-tabs"><button class="ui-btn" data-bottom="validation">VALIDATION</button><button class="ui-btn" data-bottom="json">SCENE JSON</button><button class="ui-btn" data-bottom="log">CONSOLE</button></div><span class="tiny">Drag scenes to reorder · Ctrl+S save · Ctrl+Z/Y history</span></div><div class="pb"><div id="bottomContent"></div></div></section>
</div></main>
<script type="module" src="../../assets/js/shared-header.js"></script><script type="module" src="../../assets/js/core/app.js"></script><script type="module" src="editor.js"></script></body></html>
