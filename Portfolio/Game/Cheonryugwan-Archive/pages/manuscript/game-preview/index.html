<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Preview | 천류관</title>
<link rel="stylesheet" href="../../../assets/css/common.css?v=0.9.9.5">
<link rel="stylesheet" href="../manuscript.css?v=0.9.9.5">
<link rel="stylesheet" href="./game-preview.css?v=0.9.9.5">
</head>
<body>
<header class="site-header" data-site-header data-active="manuscript" data-subtitle="천류관 : Game Preview"></header>

<main class="preview-page">
  <section class="preview-hero">
    <div>
      <p class="eyebrow">GAME PREVIEW · v0.9.10.0</p>
      <h1>Game Preview</h1>
      <p>Scene Editor JSON을 실제 에셋으로 렌더링해 파일 교체 없이 브라우저에서 즉시 테스트합니다.</p>
    </div>
    <div class="preview-status">
      <span id="load-status">JSON 입력 대기</span>
      <span id="asset-status">에셋 검사 전</span>
    </div>
  </section>

  <section class="preview-controls panel">
    <div class="control-row">
      <button id="load-scene-editor" type="button">Scene Editor 결과 불러오기</button>
      <button id="import-json" type="button">로컬 JSON 가져오기</button>
      <input id="import-json-file" type="file" accept=".json,application/json" hidden>
      <button id="back-scene-editor" type="button">Scene Editor로 돌아가기</button>
    </div>

    <div class="control-row">
      <label>화면
        <select id="viewport-mode">
          <option value="desktop">Desktop 16:9</option>
          <option value="tablet">Tablet</option>
          <option value="mobile">Mobile Portrait</option>
          <option value="mobile-landscape">Mobile Landscape</option>
        </select>
      </label>
      <label>Scene
        <select id="scene-jump"></select>
      </label>
      <button id="prev-scene" type="button">← Prev</button>
      <button id="next-scene" type="button">Next →</button>
      <button id="auto-play" type="button">Auto Play</button>
      <label>속도
        <select id="auto-speed">
          <option value="5000">5초</option>
          <option value="3500" selected>3.5초</option>
          <option value="2500">2.5초</option>
          <option value="1500">1.5초</option>
        </select>
      </label>
      <button id="mute-preview" type="button">🔊 Sound</button>
    </div>
  </section>

  <section class="preview-workspace">
    <div class="device-shell desktop" id="device-shell">
      <div class="preview-stage" id="preview-stage">
        <div id="preview-background" class="preview-background"></div>
        <div id="preview-cg" class="preview-cg"><img id="preview-cg-image" alt=""></div>

        <div id="preview-character-layer" class="preview-character-layer">
          <img id="preview-character-left" class="preview-character left" alt="">
          <img id="preview-character-center" class="preview-character center" alt="">
          <img id="preview-character-right" class="preview-character right" alt="">
        </div>

        <div id="preview-effect-layer" class="preview-effect-layer"></div>
        <div class="preview-vignette"></div>

        <div class="preview-topbar">
          <span id="preview-chapter-title">Preview</span>
          <span id="current-scene-id">-</span>
        </div>

        <div id="preview-dialogue-box" class="preview-dialogue-box">
          <div id="preview-speaker" class="preview-speaker"></div>
          <p id="preview-dialogue">Scene Editor에서 JSON을 전달하거나 로컬 JSON을 불러오세요.</p>
          <span class="preview-next">▼</span>
        </div>
      </div>
    </div>

    <aside class="debug-panel panel">
      <div class="panel-title">
        <strong>Debug / Asset Check</strong>
        <button id="clear-console" type="button">로그 지우기</button>
      </div>
      <div class="debug-summary">
        <div><span>Scene</span><strong id="debug-scene-count">0</strong></div>
        <div><span>Error</span><strong id="debug-error-count">0</strong></div>
        <div><span>Warning</span><strong id="debug-warning-count">0</strong></div>
      </div>
      <div id="asset-inspector" class="asset-inspector"></div>
      <div class="panel-title"><strong>Console</strong></div>
      <div id="preview-console" class="preview-console"></div>
    </aside>
  </section>

  <section class="scene-strip panel">
    <div class="panel-title">
      <strong>Scene Timeline</strong>
      <input id="timeline-search" type="search" placeholder="Scene ID / Speaker / Text 검색">
    </div>
    <div id="scene-timeline" class="scene-timeline"></div>
  </section>
</main>

<audio id="preview-bgm" loop></audio>
<audio id="preview-ambient" loop></audio>
<audio id="preview-sfx"></audio>

<script src="../../../assets/js/site-header.js?v=0.9.9.5"></script>
<script type="module" src="./game-preview.js?v=0.9.9.5"></script>
</body>
</html>
