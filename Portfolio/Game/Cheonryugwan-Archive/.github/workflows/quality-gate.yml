name: Cheonryugwan Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate project
        run: python tools/validate_project.py
      - name: Validate resources and links
        run: python tools/validate_resources.py
      - name: Compile Python tools
        run: python -m compileall tools

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
